<table class="forms-todo-table">
  <thead>
    <tr>
      <th>Description</th>
      <th>Due Date</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let todo of todos">
      <td>{{ todo.description }}</td>
      <td>{{ todo.dueDate | date:'medium' }}</td>
      <td>{{ todo.createdAt | date:'medium' }}</td>
    </tr>
    <tr *ngIf="todos.length === 0">
      <td colspan="3" class="empty">No todos found</td>
    </tr>
  </tbody>
</table>
