<div class="template-driven-page">
  <form #todoForm="ngForm" (ngSubmit)="onSubmit(todoForm)">
    <div class="form-group">
      <label for="description">Description</label>
      <input
        type="text"
        id="description"
        name="description"
        [(ngModel)]="description"
        required
        #descriptionInput="ngModel"
      />
      <div *ngIf="descriptionInput.invalid && descriptionInput.touched" class="error">
        Description is required
      </div>
    </div>

    <div class="form-group">
      <label for="dueDate">Due Date</label>
      <input
        type="datetime-local"
        id="dueDate"
        name="dueDate"
        [(ngModel)]="dueDate"
        required
        #dueDateInput="ngModel"
      />
      <div *ngIf="dueDateInput.invalid && dueDateInput.touched" class="error">
        Due date is required
      </div>
    </div>

    <button type="submit" [disabled]="todoForm.invalid">Add Todo</button>
  </form>

  <app-forms-todo-table [todos]="todos()" />
</div>
